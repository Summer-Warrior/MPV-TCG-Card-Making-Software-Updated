name: MPV <-> Nexus Master Hub Bidirectional Sync

# Automated scheduled/push checks are paused during pre-release personal installs.
# Hub sync checks run automatically when opening the installed Android app
# (re-enable schedule/push triggers here once official public releases begin).
on:
  workflow_dispatch:
    inputs:
      sync_direction:
        description: "Sync direction (pull_from_hub | verify_only)"
        required: false
        default: "pull_from_hub"

permissions:
  contents: write

jobs:
  bidirectional-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MPV TCG Card Making Software
        uses: actions/checkout@v4

      - name: Verify Mutual Repo Link & Pull Hub Client Index
        env:
          GH_API_VERSION: "2026-03-10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error
          from pathlib import Path

          link_path = Path("nexus-repo-link.json")
          if not link_path.exists():
              print("ERROR: nexus-repo-link.json missing at repository root.", file=sys.stderr)
              sys.exit(1)

          manifest = json.loads(link_path.read_text(encoding="utf-8"))
          this_repo = manifest["thisRepo"]
          hub_repo = manifest.get("linkedHubRepo", "Summer-Warrior/Project-MPV-RP-Master-Hub")
          hub_branch = manifest.get("linkedHubBranch", "main")
          index_path = manifest["hubIndexPath"]
          packs_dir = Path(manifest.get("exportedPacksDir", "nexus-bridge/card-packs/"))

          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": os.environ["GH_API_VERSION"],
              "User-Agent": "MPV-Nexus-Sync-Workflow/1.0",
          }
          token = os.environ.get("GITHUB_TOKEN", "").strip()
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def fetch_json(url: str):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as err:
                  return err.code, None

          # 1. Verify mutual link manifest on Nexus Master Hub
          hub_link_url = f"https://raw.githubusercontent.com/{hub_repo}/{hub_branch}/nexus-repo-link.json"
          status, hub_link = fetch_json(hub_link_url)
          if status != 200 or not isinstance(hub_link, dict):
              print(f"STATUS: ONE_WAY_ONLY (could not fetch {hub_link_url}, HTTP {status})")
          else:
              points_back = (
                  hub_link.get("linkedCardMakerRepo") == this_repo
                  or hub_link.get("linkedRepo") == this_repo
                  or this_repo in (hub_link.get("linkedRepos") or [])
              )
              print("STATUS:", "LINKED_AND_CURRENT" if points_back else "ONE_WAY_ONLY")

          # 2. Pull live client-codestring-index.json if available
          index_url = f"https://raw.githubusercontent.com/{hub_repo}/{hub_branch}/{index_path}"
          idx_status, hub_index = fetch_json(index_url)
          if idx_status == 200 and isinstance(hub_index, dict):
              out_file = Path("nexus-bridge/client-codestring-index.snapshot.json")
              out_file.parent.mkdir(parents=True, exist_ok=True)
              out_file.write_text(json.dumps(hub_index, indent=2) + "\n", encoding="utf-8")
              print(f"Pulled Hub index from {index_url} -> {out_file}")
          else:
              print(f"Hub index not yet published at {index_url} (HTTP {idx_status}); keeping local state.")

          # 3. Validate any exported packs against Locked-Client Firewall, 21-digit rule, and Time-Travel guardrail
          digit_22 = re.compile(r".*[0-9]{22}.*")
          if packs_dir.exists():
              for pack_file in sorted(packs_dir.glob("*.json")):
                  pack = json.loads(pack_file.read_text(encoding="utf-8"))
                  if pack.get("upstreamSourceLock") is True:
                      print(f"FIREWALL ERROR: {pack_file} targets a locked upstream client.", file=sys.stderr)
                      sys.exit(1)
                  for card in pack.get("cards", []):
                      if card.get("editorMode", "MATCH_GAMEPLAY") == "MATCH_GAMEPLAY":
                          if card.get("allowTimeTravelFlagsOnMatchCards", False):
                              print(f"GUARDRAIL ERROR: {pack_file} enables time-travel flags on match card.", file=sys.stderr)
                              sys.exit(1)
                          forbidden_filters = {19, 20, 21} & set(card.get("flavorFilters", []))
                          if forbidden_filters:
                              print(f"GUARDRAIL ERROR: {pack_file} match card uses forbidden Filters {sorted(forbidden_filters)}.", file=sys.stderr)
                              sys.exit(1)
                      for var_val in (card.get("codingVariables") or {}).values():
                          if digit_22.match(str(var_val)):
                              print(f"REGISTER ERROR: {pack_file} contains 22+ consecutive digits.", file=sys.stderr)
                              sys.exit(1)
                  print(f"Validated pack: {pack_file}")
          PYEOF

      - name: Commit Updated Hub Index Snapshot (If Changed)
        run: |
          if [ -n "$(git status --porcelain nexus-bridge/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nexus-bridge/
            git commit -m "chore(nexus-bridge): sync latest client-codestring-index from Nexus Master Hub"
            git push
          else
            echo "No Hub index changes to commit."
          fi

      - name: Notify Project-MPV-RP-Master-Hub (Optional Dispatch)
        if: env.MASTER_HUB_DISPATCH_TOKEN != ''
        env:
          MASTER_HUB_DISPATCH_TOKEN: ${{ secrets.MASTER_HUB_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Authorization: Bearer ${MASTER_HUB_DISPATCH_TOKEN}" \
            "https://api.github.com/repos/Summer-Warrior/Project-MPV-RP-Master-Hub/dispatches" \
            -d '{"event_type":"mpv_card_maker_synced","client_payload":{"repo":"Summer-Warrior/MPV-TCG-Card-Making-Software-Updated","branch":"main"}}'

